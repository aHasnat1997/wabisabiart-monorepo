# ────────────────────────────────────────────────────────────────
# External network shared with the DB / Redis / Bucket containers.
#
# Before running (first time only):
#   docker network create rightkitkatie-services
#
# Connect your existing service containers to it:
#   docker network connect rightkitkatie-services <db-container>
#   docker network connect rightkitkatie-services <redis-container>
#   docker network connect rightkitkatie-services <bucket-container>
#
# Run WITHOUT a .env file (to avoid $-interpolation warnings on secrets):
#   docker compose --env-file /dev/null up --build
# ────────────────────────────────────────────────────────────────
networks:
  app-network:
    external: true
