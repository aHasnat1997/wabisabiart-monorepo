version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://wabisavi-server.ahasnat.dev/api/v1
        NEXT_PUBLIC_API_AUTH_URL: /api/v1
        NEXT_PUBLIC_MEDIA_URL: http://projects-rustfs-40c115-168-231-110-104.traefik.me/rightkitkatie-media
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    container_name: rightkitkatie-frontend
    restart: unless-stopped
